<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Welcome</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            color: white;
            z-index: 10;
            position: relative;
        }

        .title {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                filter: drop-shadow(0 0 20px rgba(0, 217, 255, 0.5));
            }
            to {
                filter: drop-shadow(0 0 40px rgba(0, 255, 136, 0.8));
            }
        }

        .subtitle {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 2rem;
            animation: fadeInUp 1s ease-out;
        }

        .version {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            font-size: 1rem;
            margin-bottom: 3rem;
            backdrop-filter: blur(10px);
            animation: fadeInUp 1s ease-out 0.2s backwards;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            max-width: 600px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            cursor: pointer;
            animation: fadeInUp 1s ease-out backwards;
        }

        .feature-card:nth-child(1) { animation-delay: 0.3s; }
        .feature-card:nth-child(2) { animation-delay: 0.4s; }
        .feature-card:nth-child(3) { animation-delay: 0.5s; }
        .feature-card:nth-child(4) { animation-delay: 0.6s; }

        .feature-card:hover {
            transform: translateY(-10px) scale(1.02);
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(0, 217, 255, 0.5);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .feature-card span {
            font-size: 1.3rem;
            font-weight: 500;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(0, 217, 255, 0.6);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Vue animation */
        .bounce-enter-active {
            animation: bounce 0.5s;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .time-display {
            margin-top: 3rem;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            animation: fadeInUp 1s ease-out 0.8s backwards;
        }

        /* Ripple effect on click */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: ripple-effect 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple-effect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Particles Background -->
    <div class="particles" id="particles"></div>

    <div id="app">
        <div class="container">
            <h1 class="title">{{ message }}</h1>
            <p class="subtitle">{{ subTitle }}</p>
            <div class="version">{{ version }}</div>

            <div class="features">
                <div
                    v-for="(feature, index) in features"
                    :key="index"
                    class="feature-card"
                    @click="highlightFeature(index)"
                    :style="{ '--delay': index + 's' }"
                >
                    <span>{{ feature }}</span>
                </div>
            </div>

            <div class="time-display">
                Current Time: {{ currentTime }}
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const message = ref('Welcome to Demo');
                const subTitle = ref('A Modern Spring Boot + Vue.js Application');
                const version = ref('Version 1.0.0');
                const features = ref([
                    '🚀 Lightning Fast',
                    '🎨 Beautiful UI',
                    '⚡ Real-time Updates',
                    '🔒 Secure & Reliable'
                ]);
                const currentTime = ref('');

                const updateTime = () => {
                    const now = new Date();
                    currentTime.value = now.toLocaleString('en-US', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: false
                    });
                };

                const highlightFeature = (index) => {
                    const cards = document.querySelectorAll('.feature-card');
                    cards[index].style.animation = 'none';
                    cards[index].offsetHeight; // Trigger reflow
                    cards[index].style.animation = 'bounce 0.5s ease';
                };

                onMounted(() => {
                    updateTime();
                    setInterval(updateTime, 1000);

                    // Create particles
                    const particlesContainer = document.getElementById('particles');
                    for (let i = 0; i < 50; i++) {
                        const particle = document.createElement('div');
                        particle.className = 'particle';
                        particle.style.left = Math.random() * 100 + '%';
                        particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                        particle.style.animationDelay = Math.random() * 10 + 's';
                        particle.style.width = (Math.random() * 4 + 2) + 'px';
                        particle.style.height = particle.style.width;
                        particlesContainer.appendChild(particle);
                    }

                    // Add click ripple effect
                    document.querySelectorAll('.feature-card').forEach(card => {
                        card.addEventListener('click', function(e) {
                            const ripple = document.createElement('span');
                            ripple.className = 'ripple';
                            const rect = this.getBoundingClientRect();
                            ripple.style.left = (e.clientX - rect.left) + 'px';
                            ripple.style.top = (e.clientY - rect.top) + 'px';
                            this.appendChild(ripple);
                            setTimeout(() => ripple.remove(), 600);
                        });
                    });
                });

                return {
                    message,
                    subTitle,
                    version,
                    features,
                    currentTime,
                    highlightFeature
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
